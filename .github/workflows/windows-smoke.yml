name: Windows smoke test

on:
  push:
    branches: [main]
    paths:
      - "local-trans-api-demo/**"
      - ".github/workflows/windows-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: local-trans-api-demo

    steps:
      - uses: actions/checkout@v4

      - name: Set up the runtime
        shell: cmd
        run: |
          call setup.bat
          if errorlevel 1 exit /b 1

      - name: Run tests
        shell: cmd
        run: |
          .venv\Scripts\python -m pip install -r requirements-dev.txt
          if errorlevel 1 exit /b 1
          .venv\Scripts\python -m pytest

      - name: Start server and check health
        shell: pwsh
        run: |
          $server = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "run.bat" `
            -WorkingDirectory $PWD.Path -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/health" `
                  -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $body = $response.Content | ConvertFrom-Json
                  if ($body.status -eq "ok" -and $body.service -eq "transferhub") {
                    $healthy = $true
                    break
                  }
                }
              } catch {
                if ($server.HasExited) { break }
              }
            }
            if (-not $healthy) {
              throw "TransferHub did not pass GET /health"
            }

            & (Join-Path $PWD ".venv\\Scripts\\python.exe") "scripts\\smoke_check.py" `
              --base-url "http://127.0.0.1:8765"
            if ($LASTEXITCODE -ne 0) {
              throw "TransferHub smoke_check.py failed with exit code $LASTEXITCODE"
            }
          } finally {
            if (-not $server.HasExited) {
              taskkill /PID $server.Id /T /F 2>$null | Out-Null
            }
          }
